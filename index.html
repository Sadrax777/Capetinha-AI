<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Capetinha AI</title>

  <!-- Configuração para adicionar à Tela de Início do iPhone (iOS PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Capetinha AI" />
  <meta name="theme-color" content="#0c0711" />
  <link id="apple-icon" rel="apple-touch-icon" href="" />

  <style>
    :root {
      --bg-dark: #0c0711;
      --bg-card: #160d1f;
      --accent-red: #ff2a55;
      --accent-orange: #ff8c1a;
      --text-main: #f8f2fc;
      --text-muted: #a695b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 35%, #231133 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 12px) 14px env(safe-area-inset-bottom, 14px);
      position: relative;
    }

    /* Topo estilo IA */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #7a0c2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(255, 42, 85, 0.45);
    }

    .brand-info h1 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      font-size: 10px;
      background: rgba(46, 213, 115, 0.15);
      color: #2ed573;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Balão de resposta */
    .speech-card {
      background: rgba(22, 13, 31, 0.85);
      border: 1px solid rgba(255, 42, 85, 0.28);
      border-radius: 18px;
      padding: 14px 16px;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .user-quote {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 6px;
      text-align: center;
    }

    .demon-reply {
      font-size: 15px;
      line-height: 1.42;
      font-weight: 600;
      text-align: center;
      color: #fff;
    }

    /* Palco livre do Capetinha */
    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: 8px 0;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .demon-wrapper {
      position: absolute;
      width: 118px;
      height: 118px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      z-index: 5;
      transition: filter 0.2s;
    }

    .demon-wrapper:active {
      filter: brightness(1.2);
    }

    .demon-body-anim {
      width: 100%;
      height: 100%;
      animation: floatBob 2.6s ease-in-out infinite;
    }

    .demon-wrapper.annoyed .demon-body-anim {
      animation: shakeAngry 0.4s ease-in-out;
    }

    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(2deg); }
    }

    @keyframes shakeAngry {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-6deg); }
      50% { transform: translateX(8px) rotate(6deg); }
      75% { transform: translateX(-5px) rotate(-3deg); }
    }

    .wing-l {
      transform-origin: 42px 58px;
      animation: flapL 0.7s ease-in-out infinite;
    }
    .wing-r {
      transform-origin: 78px 58px;
      animation: flapR 0.7s ease-in-out infinite;
    }

    @keyframes flapL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes flapR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }

    /* Sugestões rápidas e input */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 99px;
      font-size: 12px;
      cursor: pointer;
    }

    .input-bar {
      display: flex;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 6px;
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      padding: 8px 10px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-red), var(--accent-orange));
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.5;
    }

    /* Modal simples de histórico */
    .history-modal {
      position: absolute;
      inset: 0;
      background: rgba(12, 7, 17, 0.95);
      z-index: 30;
      display: none;
      flex-direction: column;
      padding: 20px;
    }
    .history-modal.open { display: flex; }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      max-width: 85%;
    }
    .msg-user {
      align-self: flex-end;
      background: rgba(255, 42, 85, 0.25);
    }
    .msg-demon {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand">
        <div class="avatar-badge">😈</div>
        <div class="brand-info">
          <h1>Capetinha AI <span class="status-pill">Online</span></h1>
          <p id="mood-text">Flutuando por aí...</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-history" title="Histórico">💬</button>
        <button class="icon-btn" id="btn-voice" title="Voz">🔊</button>
        <button class="icon-btn" id="btn-reset" title="Limpar memória">↺</button>
      </div>
    </header>

    <div class="speech-card">
      <div class="user-quote" id="user-quote">Toque em mim ou mande sua dúvida</div>
      <div class="demon-reply" id="demon-reply">"Fala logo, mortal. Qual decisão sensata vamos estragar hoje?"</div>
    </div>

    <main class="stage" id="stage">
      <div class="demon-wrapper" id="demon">
        <div class="demon-body-anim">
          <svg viewBox="0 0 120 120" width="118" height="118">
            <defs>
              <radialGradient id="skinGrad" cx="45%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ff5e7e" />
                <stop offset="65%" stop-color="#d91642" />
                <stop offset="100%" stop-color="#870926" />
              </radialGradient>
            </defs>
            <!-- Asas -->
            <path class="wing-l" d="M42 58 C20 40, 12 60, 26 72 C32 66, 37 68, 42 66 Z" fill="#6b0f2b" />
            <path class="wing-r" d="M78 58 C100 40, 108 60, 94 72 C88 66, 83 68, 78 66 Z" fill="#6b0f2b" />
            <!-- Rabinho -->
            <path d="M74 88 Q98 92 94 74" fill="none" stroke="#b81237" stroke-width="4" stroke-linecap="round" />
            <polygon points="94,70 89,78 99,78" fill="#ff2a55" />
            <!-- Corpo -->
            <ellipse cx="60" cy="76" rx="20" ry="22" fill="url(#skinGrad)" />
            <!-- Cabeça -->
            <circle cx="60" cy="48" r="24" fill="url(#skinGrad)" />
            <!-- Chifres -->
            <path d="M43 30 Q34 14 48 22 Z" fill="#ffb833" />
            <path d="M77 30 Q86 14 72 22 Z" fill="#ffb833" />
            <!-- Olhos -->
            <circle cx="51" cy="47" r="5.5" fill="#fff" />
            <circle cx="69" cy="47" r="5.5" fill="#fff" />
            <circle cx="52" cy="47" r="2.6" fill="#14081a" />
            <circle cx="68" cy="47" r="2.6" fill="#14081a" />
            <!-- Sobrancelhas maliciosas -->
            <line x1="45" y1="39" x2="56" y2="43" stroke="#3b0514" stroke-width="2.5" stroke-linecap="round" />
            <line x1="75" y1="39" x2="64" y2="43" stroke="#3b0514" stroke-width="2.5" stroke-linecap="round" />
            <!-- Sorriso com presinha -->
            <path d="M51 57 Q60 65 69 57" fill="none" stroke="#3b0514" stroke-width="2.5" stroke-linecap="round" />
            <polygon points="64,59 67,59 65.5,63" fill="#fff" />
          </svg>
        </div>
      </div>
    </main>

    <div class="chips">
      <button class="chip" data-q="Deveria sair hoje à noite?">🍻 Sair hoje?</button>
      <button class="chip" data-q="Compro algo caro por impulso?">💸 Comprar por impulso?</button>
      <button class="chip" data-q="Mando mensagem pra quem eu não deveria?">📱 Mandar mensagem?</button>
      <button class="chip" data-q="Tomo café agora mesmo sendo tarde?">☕ Café de madrugada?</button>
    </div>

    <form class="input-bar" id="chat-form">
      <input type="text" id="user-input" placeholder="Peça um mau conselho..." autocomplete="off" maxlength="250" />
      <button type="submit" class="send-btn" id="send-btn">Enviar</button>
    </form>

    <div class="history-modal" id="history-modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Memória da Sessão</strong>
        <button class="icon-btn" id="close-history">✕</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script>
    // Gera automaticamente o ícone PNG para a Tela de Início do iPhone (iOS)
    (function generateIOSIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#160d1f';
      ctx.fillRect(0, 0, 180, 180);
      ctx.font = '105px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('😈', 90, 96);
      document.getElementById('apple-icon').href = canvas.toDataURL('image/png');
    })();

    const stage = document.getElementById('stage');
    const demon = document.getElementById('demon');
    const moodText = document.getElementById('mood-text');
    const userQuote = document.getElementById('user-quote');
    const demonReply = document.getElementById('demon-reply');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let chatHistory = [];
    let voiceEnabled = true;
    let isBusy = false;

    const pokeLines = [
      "Ei! Tira esse dedo daí, eu não sou bicho de pelúcia!",
      "Cutuca de novo pra ver se eu não te convenço a gastar seu salário todo hoje.",
      "Que audácia! Eu sou uma entidade do caos, não um botão de elevador.",
      "Para de me cutucar e me faz uma pergunta difícil logo."
    ];

    // Movimento autônomo suave pelo palco
    let posX = 0.5, posY = 0.5, targetX = 0.5, targetY = 0.5;
    function pickNewTarget() {
      if (!isBusy) {
        targetX = 0.22 + Math.random() * 0.56;
        targetY = 0.24 + Math.random() * 0.52;
      }
      setTimeout(pickNewTarget, 2600 + Math.random() * 2200);
    }
    pickNewTarget();

    function animateFlight() {
      posX += (targetX - posX) * 0.025;
      posY += (targetY - posY) * 0.025;
      const rect = stage.getBoundingClientRect();
      demon.style.left = `${posX * rect.width}px`;
      demon.style.top = `${posY * rect.height}px`;
      requestAnimationFrame(animateFlight);
    }
    requestAnimationFrame(animateFlight);

    // Voz masculina suave
    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/["*]/g, '');
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'pt-BR';
      utter.pitch = 0.78;
      utter.rate = 0.94;
      const voices = window.speechSynthesis.getVoices();
      const ptMale = voices.find(v => v.lang.includes('pt') && /daniel|felipe|ricardo|male|masculin/i.test(v.name))
                  || voices.find(v => v.lang.includes('pt'));
      if (ptMale) utter.voice = ptMale;
      window.speechSynthesis.speak(utter);
    }

    // Reação ao cutucar
    demon.addEventListener('click', () => {
      demon.classList.remove('annoyed');
      void demon.offsetWidth;
      demon.classList.add('annoyed');
      targetX = 0.2 + Math.random() * 0.6;
      targetY = 0.2 + Math.random() * 0.6;
      const line = pokeLines[Math.floor(Math.random() * pokeLines.length)];
      moodText.textContent = "Irritado com você";
      userQuote.textContent = "*Você cutucou o Capetinha*";
      demonReply.textContent = `"${line}"`;
      speak(line);
    });

    async function askDemon(question) {
      const text = question.trim();
      if (!text || isBusy) return;

      isBusy = true;
      sendBtn.disabled = true;
      targetX = 0.5;
      targetY = 0.48;
      moodText.textContent = "Tramando uma ideia péssima...";
      userQuote.textContent = `Você: "${text}"`;
      demonReply.textContent = "Deixa eu pensar no pior caminho possível...";

      chatHistory.push({ role: 'user', parts: [{ text }] });

      try {
        const res = await fetch('/api/conselho', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: chatHistory })
        });
        const data = await res.json();
        const reply = data.reply || "Vai na fé e depois lida com as consequências.";

        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        demonReply.textContent = `"${reply}"`;
        moodText.textContent = "Satisfeito com o caos";
        speak(reply);
      } catch (e) {
        demonReply.textContent = '"Perdi o sinal com o submundo. Tenta de novo!"';
        moodText.textContent = "Sem sinal";
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInput.value;
      userInput.value = '';
      askDemon(val);
    });

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => askDemon(btn.dataset.q));
    });

    document.getElementById('btn-voice').addEventListener('click', (e) => {
      voiceEnabled = !voiceEnabled;
      e.currentTarget.textContent = voiceEnabled ? '🔊' : '🔇';
      if (!voiceEnabled) window.speechSynthesis.cancel();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      chatHistory = [];
      userQuote.textContent = "Memória apagada";
      demonReply.textContent = '"Pronto, fingi que nunca te vi. Qual a próxima besteira?"';
      moodText.textContent = "Pronto para recomeçar";
    });

    // Histórico modal
    const modal = document.getElementById('history-modal');
    const historyList = document.getElementById('history-list');
    document.getElementById('btn-history').addEventListener('click', () => {
      historyList.innerHTML = chatHistory.length
        ? chatHistory.map(m => `<div class="msg-bubble ${m.role === 'user' ? 'msg-user' : 'msg-demon'}">${m.parts[0].text}</div>`).join('')
        : '<p style="color:#a695b8; text-align:center;">Nenhuma conversa ainda.</p>';
      modal.classList.add('open');
    });
    document.getElementById('close-history').addEventListener('click', () => modal.classList.remove('open'));
  </script>
</body>
</html>
