<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Capetinha AI</title>
  <style>
    :root {
      --bg-void: #050508;
      --bg-card: #0c0d14;
      --bg-cell: #07080e;
      --neon-red: #ff2a55;
      --neon-orange: #ff7b00;
      --neon-cyan: #22d3ee;
      --neon-purple: #a855f7;
      --border-neon: rgba(255, 42, 85, 0.35);
      --text-main: #f4f6fb;
      --text-muted: #98a2b3;
      --wa-in: #141923;
      --wa-out: #1d1226;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 42, 85, 0.16), transparent 50%),
        radial-gradient(circle at 85% 20%, rgba(34, 211, 238, 0.08), transparent 45%),
        var(--bg-void);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 940px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Topo estilo chat */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      box-shadow: 0 0 20px rgba(255, 42, 85, 0.12);
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .contact-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: linear-gradient(135deg, rgba(255, 42, 85, 0.25), rgba(255, 123, 0, 0.22));
      border: 1px solid rgba(255, 42, 85, 0.55);
      box-shadow: 0 0 12px rgba(255, 42, 85, 0.35);
      flex-shrink: 0;
    }

    .contact-info {
      min-width: 0;
    }

    .contact-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .contact-name {
      font-weight: 700;
      font-size: 15.5px;
      letter-spacing: 0.2px;
    }

    .pill-online {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.35);
    }

    .contact-status {
      font-size: 12px;
      color: var(--neon-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .btn-ghost {
      height: 34px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .btn-ghost:active {
      transform: scale(0.94);
    }

    /* Prisãozinha neon do diabinho */
    .cell-box {
      position: relative;
      height: 186px;
      flex-shrink: 0;
      border-radius: 20px;
      background:
        linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 42, 85, 0.05) 1px, transparent 1px),
        var(--bg-cell);
      background-size: 24px 24px;
      border: 1px solid rgba(255, 42, 85, 0.45);
      box-shadow:
        inset 0 0 26px rgba(255, 42, 85, 0.16),
        0 0 18px rgba(34, 211, 238, 0.08);
      overflow: hidden;
    }

    .cell-tag {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(34, 211, 238, 0.78);
      background: rgba(5, 5, 8, 0.7);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.25);
      pointer-events: none;
      z-index: 2;
    }

    .cell-counter {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 10.5px;
      font-weight: 700;
      color: #ffb4c2;
      background: rgba(255, 42, 85, 0.16);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 42, 85, 0.35);
      pointer-events: none;
      z-index: 2;
    }

    .speech-pop {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 92%;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(12, 13, 20, 0.92);
      border: 1px solid rgba(255, 123, 0, 0.55);
      color: #ffd199;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* Wrapper que move pela prisãozinha sem bloquear a tela */
    .devil-mover {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      transition: left 0.85s cubic-bezier(0.22, 1, 0.36, 1), top 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
    }

    .devil-hit {
      width: 96px;
      height: 96px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      outline: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    .aura {
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 42, 85, 0.42), rgba(255, 123, 0, 0.12) 60%, transparent 75%);
      pointer-events: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .devil-art {
      width: 84px;
      height: 84px;
      position: relative;
      pointer-events: none;
      transform-origin: center center;
      filter: drop-shadow(0 0 10px rgba(255, 42, 85, 0.45));
    }

    /* Animações variadas de reação */
    .devil-art.anim-hop {
      animation: animHop 0.48s cubic-bezier(0.2, 1.3, 0.35, 1);
    }

    .devil-art.anim-scare {
      animation: animScare 0.5s ease-out;
    }

    .devil-art.anim-spin {
      animation: animSpin 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .devil-art.anim-yawn {
      animation: animYawn 0.75s ease-in-out;
    }

    .devil-art.anim-wink {
      animation: animWink 0.45s ease-in-out;
    }

    .devil-art.anim-burp {
      animation: animBurp 0.5s ease-out;
    }

    .devil-art.anim-fart {
      animation: animFart 0.55s ease-out;
    }

    /* Modo diabão frenético (easter egg 10 cliques rápidos) */
    .cell-box.frenzy {
      border-color: #ff2a55;
      box-shadow:
        inset 0 0 42px rgba(255, 42, 85, 0.42),
        0 0 28px rgba(255, 42, 85, 0.55);
      animation: cellShake 0.14s linear infinite;
    }

    .cell-box.frenzy .aura {
      transform: scale(1.55);
      background: radial-gradient(circle, rgba(255, 42, 85, 0.85), rgba(255, 123, 0, 0.45) 58%, transparent 78%);
    }

    .cell-box.frenzy .devil-art {
      transform: scale(1.24);
      animation: frenzyRage 0.16s linear infinite;
      filter: drop-shadow(0 0 18px rgba(255, 42, 85, 0.95));
    }

    @keyframes animHop {
      0% { transform: translateY(0) scale(1, 1); }
      35% { transform: translateY(-18px) scale(0.92, 1.12); }
      70% { transform: translateY(2px) scale(1.1, 0.9); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    @keyframes animScare {
      0% { transform: scale(1); }
      20% { transform: scale(1.22) translateX(-6px); }
      45% { transform: scale(0.88) translateX(6px); }
      75% { transform: scale(1.08) translateX(-3px); }
      100% { transform: scale(1) translateX(0); }
    }

    @keyframes animSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.12); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes animYawn {
      0%, 100% { transform: scale(1) translateY(0); }
      45% { transform: scale(1.08, 0.94) translateY(4px); }
    }

    @keyframes animWink {
      0%, 100% { transform: rotate(0deg) scale(1); }
      40% { transform: rotate(-10deg) scale(1.08); }
      75% { transform: rotate(8deg) scale(1.04); }
    }

    @keyframes animBurp {
      0% { transform: scale(1); }
      35% { transform: scale(1.18, 0.92); }
      70% { transform: scale(0.95, 1.06); }
      100% { transform: scale(1); }
    }

    @keyframes animFart {
      0% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-7px) rotate(-8deg); }
      55% { transform: translateX(7px) rotate(8deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes frenzyRage {
      0% { transform: scale(1.24) rotate(-8deg) translate(-2px, 1px); }
      50% { transform: scale(1.28) rotate(8deg) translate(2px, -2px); }
      100% { transform: scale(1.24) rotate(-8deg) translate(-2px, 1px); }
    }

    @keyframes cellShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -2px); }
    }

    /* Área de mensagens tipo WhatsApp */
    .chat-feed {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      user-select: text;
      -webkit-user-select: text;
    }

    .bubble {
      max-width: 85%;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.42;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
      animation: msgIn 0.2s ease;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--wa-in);
      border: 1px solid rgba(34, 211, 238, 0.22);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--wa-out);
      border: 1px solid rgba(255, 42, 85, 0.34);
      border-bottom-right-radius: 4px;
    }

    .bubble-meta {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Atalhos + Surpreende */
    .quick-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .quick-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .chip.surprise {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.24), rgba(255, 42, 85, 0.28));
      border-color: rgba(255, 42, 85, 0.55);
      color: #ffe4ea;
    }

    .chip:active {
      transform: scale(0.95);
    }

    /* Barra de digitação estilo chat */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
    }

    .msg-input {
      flex: 1;
      min-width: 0;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #06070c;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .msg-input:focus {
      border-color: var(--neon-cyan);
    }

    .send-btn {
      padding: 11px 16px;
      border-radius: 13px;
      border: none;
      background: linear-gradient(135deg, var(--neon-red), var(--neon-orange));
      color: #fff;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="contact">
        <div class="contact-badge">😈</div>
        <div class="contact-info">
          <div class="contact-name-row">
            <span class="contact-name">Capetinha AI</span>
            <span class="pill-online">online</span>
          </div>
          <div class="contact-status" id="statusLine">trancado na cela neon • pronto pro caos</div>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="btn-ghost" id="clearBtn">Limpar</button>
      </div>
    </header>

    <section class="cell-box" id="cellBox" aria-label="Cela interativa do Capetinha AI">
      <span class="cell-tag">cela neon • submundo</span>
      <span class="cell-counter" id="tapCounter">toques: 0</span>

      <div class="devil-mover" id="devilMover">
        <button type="button" class="devil-hit" id="devilHit" aria-label="Interagir com o diabinho">
          <span class="aura"></span>
          <svg class="devil-art" id="devilArt" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Chifres cartunescos -->
            <path d="M35 35C22 23 27 8 38 9C42 17 44 24 48 30" fill="#ff9f1c" stroke="#3b0716" stroke-width="3.2" stroke-linejoin="round"/>
            <path d="M85 35C98 23 93 8 82 9C78 17 76 24 72 30" fill="#ff9f1c" stroke="#3b0716" stroke-width="3.2" stroke-linejoin="round"/>
            <!-- Orelhinhas/laterais -->
            <circle cx="31" cy="56" r="6" fill="#ff2a55" stroke="#3b0716" stroke-width="2.8"/>
            <circle cx="89" cy="56" r="6" fill="#ff2a55" stroke="#3b0716" stroke-width="2.8"/>
            <!-- Bracinhos -->
            <path d="M32 70C18 67 14 56 21 51C26 55 30 59 35 62" fill="#ff2a55" stroke="#3b0716" stroke-width="3" stroke-linecap="round"/>
            <path d="M88 70C102 67 106 56 99 51C94 55 90 59 85 62" fill="#ff2a55" stroke="#3b0716" stroke-width="3" stroke-linecap="round"/>
            <!-- Corpo -->
            <ellipse cx="60" cy="65" rx="28" ry="33" fill="#ff2a55" stroke="#3b0716" stroke-width="3.2"/>
            <!-- Manchinha clara -->
            <ellipse cx="60" cy="72" rx="15" ry="17" fill="#ff6b86" opacity="0.5"/>
            <!-- Olhos -->
            <ellipse cx="49" cy="54" rx="7.5" ry="8.5" fill="#ffffff" stroke="#3b0716" stroke-width="2"/>
            <ellipse cx="71" cy="54" rx="7.5" ry="8.5" fill="#ffffff" stroke="#3b0716" stroke-width="2"/>
            <circle cx="50.5" cy="55" r="3.6" fill="#09080f"/>
            <circle cx="69.5" cy="55" r="3.6" fill="#09080f"/>
            <circle cx="51.8" cy="53.4" r="1.3" fill="#ffffff"/>
            <circle cx="70.8" cy="53.4" r="1.3" fill="#ffffff"/>
            <!-- Sobrancelhas -->
            <path id="browLeft" d="M39 43L55 49" stroke="#3b0716" stroke-width="3.6" stroke-linecap="round"/>
            <path id="browRight" d="M81 43L65 49" stroke="#3b0716" stroke-width="3.6" stroke-linecap="round"/>
            <!-- Boca -->
            <path id="mouth" d="M47 70C52 77 68 77 73 70" stroke="#3b0716" stroke-width="3.2" stroke-linecap="round"/>
            <!-- Dentinhos -->
            <path d="M51 72L53 76L55 72.5" fill="#ffffff"/>
            <path d="M65 72.5L67 76L69 72" fill="#ffffff"/>
            <!-- Rabo -->
            <path d="M86 85C101 85 104 72 96 66" stroke="#ff2a55" stroke-width="4" stroke-linecap="round"/>
            <path d="M94 62L103 64L97 71Z" fill="#ff9f1c" stroke="#3b0716" stroke-width="1.8"/>
          </svg>
        </button>
      </div>

      <div class="speech-pop" id="speechPop">Cutuca aí ou manda uma ideia ruim...</div>
    </section>

    <main class="chat-feed" id="chatFeed" aria-live="polite">
      <div class="bubble bot">
        Fala, mortal! Tô preso aqui nessa caixinha neon, mas minha língua continua solta. Manda um dilema ou aperta <b>Surpreende</b>.
        <span class="bubble-meta">Capetinha AI</span>
      </div>
    </main>

    <div class="quick-row">
      <button type="button" class="chip surprise" id="surpriseBtn">⚡ Surpreende</button>
      <button type="button" class="chip" data-prompt="Devo sair hoje à noite mesmo sem dinheiro?">🍻 Sair hoje?</button>
      <button type="button" class="chip" data-prompt="Devo comprar algo caro por impulso agora?">💸 Comprar por impulso?</button>
      <button type="button" class="chip" data-prompt="Devo mandar mensagem agora para quem não devo?">📱 Mandar mensagem?</button>
    </div>

    <form class="input-bar" id="inputBar">
      <input
        type="text"
        class="msg-input"
        id="msgInput"
        placeholder="Digite uma mensagem..."
        maxlength="300"
        autocomplete="off"
      />
      <button type="submit" class="send-btn" id="sendBtn">Enviar</button>
    </form>
  </div>

  <script>
    const cellBox = document.getElementById('cellBox');
    const devilMover = document.getElementById('devilMover');
    const devilHit = document.getElementById('devilHit');
    const devilArt = document.getElementById('devilArt');
    const speechPop = document.getElementById('speechPop');
    const statusLine = document.getElementById('statusLine');
    const tapCounter = document.getElementById('tapCounter');
    const chatFeed = document.getElementById('chatFeed');
    const clearBtn = document.getElementById('clearBtn');
    const surpriseBtn = document.getElementById('surpriseBtn');
    const inputBar = document.getElementById('inputBar');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const chips = document.querySelectorAll('.chip[data-prompt]');

    const IDLE_COMMENTS = [
      'Ei, tá me encarando por quê? Vai pedir um caos ou vai ficar só olhando?',
      'Dez segundos parado... achou que eu ia pagar aluguel aqui dentro?',
      'Tô vendo você aí parado pensando besteira. Manda logo!',
      'Silêncio suspeito... aposto que tá tramando gastar o que não tem.',
      'A grade é neon, mas eu tô entediado. Faz alguma coisa aí!'
    ];

    const POKE_ACTIONS = [
      { cls: 'anim-hop', pop: 'Boing! Pulei mais alto que a sua fatura!' },
      { cls: 'anim-scare', pop: 'UAAAH! Que susto, zé! Quase derrubei o tridente!' },
      { cls: 'anim-spin', pop: 'Vuuuupt! Girou tudo aqui na cela!' },
      { cls: 'anim-yawn', pop: 'Huuuaaah... *bocejo de fumaça*... que preguiça.' },
      { cls: 'anim-wink', pop: 'Pisquei e já bolei três planos duvidosos.' },
      { cls: 'anim-burp', pop: '*BRUUUUP!* Foi mal, o enxofre pegou pesado hoje.' },
      { cls: 'anim-fart', pop: '*PFFFFT!* Alerta de névoa tóxica na cela!' }
    ];

    const SURPRISE_PROMPTS = [
      'Me dá um mau conselho absurdo para uma terça-feira comum',
      'Se eu pudesse fazer uma escolha impulsiva agora, qual seria a pior?',
      'Como transformar uma decisão simples num drama desnecessário?',
      'Qual a pior desculpa criativa para furar um compromisso hoje?',
      'Me convence a fazer algo totalmente fora da rotina de um jeito engraçado'
    ];

    const FRENZY_INSULTS = [
      'SEU BOCÓ! CABEÇA DE BAGRE!',
      'ZÉ RUELA! SOLTA O MEU CHIFRE!',
      'TRASTE! ESQUENTADINHO DE MEIA TIGELA!',
      'BANANÃO! QUER VIRAR CHURRASCO DE ENXOFRE?!',
      'TONHÃO! TÁ ACHANDO QUE EU SOU SACO DE PANCADA?!'
    ];

    let totalTaps = 0;
    let recentTapTimes = [];
    let isFrenzy = false;
    let frenzyTimeout = null;
    let animTimeout = null;
    let wanderInterval = null;
    let idleTimeout = null;
    let isSending = false;
    let history = [];

    function setBubbleSpeech(text) {
      speechPop.textContent = text;
    }

    function addChatMessage(sender, text) {
      const div = document.createElement('div');
      div.className = `bubble ${sender === 'user' ? 'user' : 'bot'}`;
      const meta = document.createElement('span');
      meta.className = 'bubble-meta';
      meta.textContent = sender === 'user' ? 'Você' : 'Capetinha AI';

      div.appendChild(document.createTextNode(text));
      div.appendChild(meta);
      chatFeed.appendChild(div);
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function resetIdleTimer() {
      clearTimeout(idleTimeout);
      idleTimeout = setTimeout(() => {
        if (isFrenzy || isSending) return;
        const line = IDLE_COMMENTS[Math.floor(Math.random() * IDLE_COMMENTS.length)];
        setBubbleSpeech(line);
        statusLine.textContent = 'reparou que você tá parado encarando...';
      }, 10000);
    }

    function moveDevilInsideCell() {
      if (isFrenzy) return;
      const boxRect = cellBox.getBoundingClientRect();
      const padX = 56;
      const topMin = 44;
      const bottomMax = Math.max(topMin + 20, boxRect.height - 58);

      const minX = padX;
      const maxX = Math.max(minX + 20, boxRect.width - padX);

      const nextX = minX + Math.random() * (maxX - minX);
      const nextY = topMin + Math.random() * (bottomMax - topMin);

      devilMover.style.left = `${nextX}px`;
      devilMover.style.top = `${nextY}px`;
    }

    function startWandering() {
      clearInterval(wanderInterval);
      wanderInterval = setInterval(() => {
        moveDevilInsideCell();
      }, 2200);
    }

    function triggerFrenzyMode() {
      isFrenzy = true;
      clearTimeout(frenzyTimeout);
      cellBox.classList.add('frenzy');
      statusLine.textContent = 'MODO DIABÃO FRENÉTICO ATIVADO!';

      let insultIdx = 0;
      setBubbleSpeech(FRENZY_INSULTS[insultIdx]);

      const insultCycle = setInterval(() => {
        insultIdx += 1;
        if (insultIdx < FRENZY_INSULTS.length) {
          setBubbleSpeech(FRENZY_INSULTS[insultIdx]);
        }
      }, 580);

      frenzyTimeout = setTimeout(() => {
        clearInterval(insultCycle);
        isFrenzy = false;
        cellBox.classList.remove('frenzy');
        recentTapTimes = [];
        statusLine.textContent = 'trancado na cela neon • pronto pro caos';
        setBubbleSpeech('Ufa... já xinguei o bastante por hoje. Manda mensagem!');
      }, 3000);
    }

    function handleDevilPoke() {
      resetIdleTimer();
      totalTaps += 1;
      tapCounter.textContent = `toques: ${totalTaps}`;

      const now = Date.now();
      recentTapTimes = recentTapTimes.filter(t => now - t <= 2500);
      recentTapTimes.push(now);

      if (recentTapTimes.length >= 10 && !isFrenzy) {
        triggerFrenzyMode();
        return;
      }

      if (isFrenzy) return;

      const action = POKE_ACTIONS[Math.floor(Math.random() * POKE_ACTIONS.length)];
      devilArt.classList.remove(
        'anim-hop',
        'anim-scare',
        'anim-spin',
        'anim-yawn',
        'anim-wink',
        'anim-burp',
        'anim-fart'
      );
      void devilArt.offsetWidth;
      devilArt.classList.add(action.cls);

      setBubbleSpeech(action.pop);
      statusLine.textContent = 'cutucado na cela • reagindo';

      // Pequeno deslocamento ao reagir ao toque
      moveDevilInsideCell();

      clearTimeout(animTimeout);
      animTimeout = setTimeout(() => {
        devilArt.classList.remove(action.cls);
        if (!isFrenzy && !isSending) {
          statusLine.textContent = 'trancado na cela neon • pronto pro caos';
        }
      }, 650);
    }

    devilHit.addEventListener('click', handleDevilPoke);

    async function sendPrompt(rawText) {
      const text = String(rawText || '').trim();
      if (!text || isSending) return;

      resetIdleTimer();
      isSending = true;
      sendBtn.disabled = true;
      surpriseBtn.disabled = true;
      statusLine.textContent = 'bolando uma ideia péssima...';
      setBubbleSpeech('Deixa eu pensar no pior caminho possível...');

      addChatMessage('user', text);
      history.push({ role: 'user', parts: [{ text }] });

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch('/api/conselho', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: history.slice(-8) }),
          signal: controller.signal
        });

        const data = await res.json().catch(() => ({}));
        const reply =
          typeof data?.reply === 'string' && data.reply.trim()
            ? data.reply.trim()
            : 'O sinal do submundo deu uma engasgada aqui. Tenta de novo!';

        addChatMessage('bot', reply);
        history.push({ role: 'model', parts: [{ text: reply }] });
        setBubbleSpeech('Conselho entregue. Vai encarar?');
        statusLine.textContent = 'satisfeito com o caos';
      } catch {
        const fallback = 'A conexão demorou demais e o sinal falhou. Tenta mandar de novo!';
        addChatMessage('bot', fallback);
        setBubbleSpeech('Sinal engasgou... tenta de novo!');
        statusLine.textContent = 'sinal instável';
      } finally {
        clearTimeout(timeoutId);
        isSending = false;
        sendBtn.disabled = false;
        surpriseBtn.disabled = false;
        resetIdleTimer();
      }
    }

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const prompt = chip.getAttribute('data-prompt');
        if (prompt) sendPrompt(prompt);
      });
    });

    surpriseBtn.addEventListener('click', () => {
      resetIdleTimer();
      const pick = SURPRISE_PROMPTS[Math.floor(Math.random() * SURPRISE_PROMPTS.length)];
      sendPrompt(pick);
    });

    clearBtn.addEventListener('click', () => {
      resetIdleTimer();
      history = [];
      chatFeed.innerHTML = '';
      addChatMessage('bot', 'Chat limpo! Manda o próximo dilema que eu já tô aquecendo as chamas.');
      setBubbleSpeech('Cela limpa, caos pronto.');
      statusLine.textContent = 'trancado na cela neon • pronto pro caos';
    });

    inputBar.addEventListener('submit', e => {
      e.preventDefault();
      const value = msgInput.value;
      msgInput.value = '';
      sendPrompt(value);
    });

    msgInput.addEventListener('input', resetIdleTimer);
    document.addEventListener('pointerdown', resetIdleTimer, { passive: true });

    // Inicia movimentação suave e contagem de ociosidade
    setTimeout(moveDevilInsideCell, 300);
    startWandering();
    resetIdleTimer();
  </script>
</body>
</html>
