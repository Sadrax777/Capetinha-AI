<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Capetinha AI</title>

  <!-- Configuração para adicionar à Tela de Início do iPhone (iOS PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Capetinha AI" />
  <meta name="theme-color" content="#0c0711" />
  <link id="apple-icon" rel="apple-touch-icon" href="" />

  <style>
    :root {
      --bg-dark: #0c0711;
      --bg-card: #160d1f;
      --accent-red: #ff2a55;
      --accent-orange: #ff8c1a;
      --accent-cyan: #22d3ee;
      --text-main: #f8f2fc;
      --text-muted: #a695b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 35%, #231133 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 12px) 14px env(safe-area-inset-bottom, 14px);
      position: relative;
    }

    /* Topo estilo IA */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #7a0c2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(255, 42, 85, 0.45);
    }

    .brand-info h1 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      font-size: 10px;
      background: rgba(46, 213, 115, 0.15);
      color: #2ed573;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Balão de resposta */
    .speech-card {
      background: rgba(22, 13, 31, 0.85);
      border: 1px solid rgba(255, 42, 85, 0.28);
      border-radius: 18px;
      padding: 14px 16px;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 10;
      backdrop-filter: blur(8px);
      user-select: text;
      -webkit-user-select: text;
    }

    .user-quote {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 6px;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .demon-reply {
      font-size: 15px;
      line-height: 1.42;
      font-weight: 600;
      text-align: center;
      color: #fff;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Palco livre / mundinho neon do Capetinha */
    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: 8px 0;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 42, 85, 0.12), transparent 65%),
        linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 42, 85, 0.03) 1px, transparent 1px),
        rgba(10, 6, 16, 0.55);
      background-size: auto, 26px 26px, 26px 26px, auto;
      border: 1px solid rgba(255, 42, 85, 0.25);
      box-shadow: inset 0 0 28px rgba(255, 42, 85, 0.1);
    }

    .stage-hud {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
      z-index: 4;
    }

    .stage-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: #d4c4e3;
      background: rgba(12, 7, 17, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .stage-note {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 92%;
      font-size: 11.5px;
      font-weight: 600;
      color: #ffd49e;
      background: rgba(16, 9, 24, 0.9);
      border: 1px solid rgba(255, 140, 26, 0.45);
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 6;
    }

    /* Foguinhos surpresa de conselho grátis */
    .fire-spark {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 190, 50, 0.8);
      background: radial-gradient(circle, rgba(255, 180, 30, 0.35), rgba(255, 42, 85, 0.22));
      box-shadow: 0 0 15px rgba(255, 140, 26, 0.65);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 7;
      animation: sparkPulse 1.3s ease-in-out infinite;
      touch-action: manipulation;
    }

    .fire-spark:active {
      transform: scale(1.25);
    }

    @keyframes sparkPulse {
      0%, 100% { transform: scale(0.95) rotate(-5deg); }
      50% { transform: scale(1.12) rotate(5deg); }
    }

    .demon-wrapper {
      position: absolute;
      width: 124px;
      height: 122px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      z-index: 5;
    }

    .demon-body-anim {
      width: 100%;
      height: 100%;
      animation: floatBob 2.8s ease-in-out infinite;
    }

    /* Quando está caminhando no chão, tira a flutuação e faz passinho */
    .demon-wrapper.walking .demon-body-anim {
      animation: walkBounce 0.44s ease-in-out infinite;
    }

    /* Asas visíveis só quando voa; somem/encolhem quando caminha */
    .wings-group {
      transform-origin: 60px 62px;
      transition: opacity 0.22s ease, transform 0.25s ease;
    }

    .demon-wrapper.walking .wings-group {
      opacity: 0;
      transform: scale(0.15);
      pointer-events: none;
    }

    .wing-l {
      transform-origin: 40px 60px;
      animation: flapL 0.65s ease-in-out infinite;
    }
    .wing-r {
      transform-origin: 80px 60px;
      animation: flapR 0.65s ease-in-out infinite;
    }

    /* Perninhas aparecem quando caminha; encolhem quando voa */
    .legs-group {
      transform-origin: 60px 92px;
      opacity: 0;
      transform: scaleY(0.1);
      transition: opacity 0.22s ease, transform 0.25s ease;
    }

    .demon-wrapper.walking .legs-group {
      opacity: 1;
      transform: scaleY(1);
    }

    .leg-l {
      transform-origin: 53px 94px;
      animation: stepL 0.44s ease-in-out infinite;
    }

    .leg-r {
      transform-origin: 67px 94px;
      animation: stepR 0.44s ease-in-out infinite;
    }

    /* Visão de costas (quando ele vira de costas) */
    .back-view {
      display: none;
    }

    .demon-body-anim.turned-back .front-view {
      display: none;
    }

    .demon-body-anim.turned-back .back-view {
      display: block;
    }

    @keyframes walkBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes stepL {
      0%, 100% { transform: rotate(-18deg) translateY(0); }
      50% { transform: rotate(18deg) translateY(-2px); }
    }

    @keyframes stepR {
      0%, 100% { transform: rotate(18deg) translateY(-2px); }
      50% { transform: rotate(-18deg) translateY(0); }
    }

    /* Animações variadas ao tocar */
    .demon-body-anim.react-hop { animation: reactHop 0.48s cubic-bezier(0.2, 1.3, 0.35, 1); }
    .demon-body-anim.react-scare { animation: reactScare 0.5s ease-out; }
    .demon-body-anim.react-spin { animation: reactSpin 0.55s ease-out; }
    .demon-body-anim.react-flip { animation: reactFlip 0.72s cubic-bezier(0.22, 1, 0.36, 1); }
    .demon-body-anim.react-swim { animation: reactSwim 0.75s ease-in-out infinite; }
    .demon-body-anim.react-back { animation: reactBack 0.45s ease-out; }
    .demon-body-anim.react-yawn { animation: reactYawn 0.7s ease-in-out; }
    .demon-body-anim.react-wink { animation: reactWink 0.45s ease-in-out; }
    .demon-body-anim.react-burp { animation: reactBurp 0.5s ease-out; }
    .demon-body-anim.react-fart { animation: reactFart 0.55s ease-out; }

    /* Modo diabão frenético (10 cliques rápidos) */
    .stage.frenzy {
      border-color: var(--accent-red);
      box-shadow:
        inset 0 0 42px rgba(255, 42, 85, 0.38),
        0 0 24px rgba(255, 42, 85, 0.45);
      animation: stageShake 0.14s linear infinite;
    }

    .stage.frenzy .demon-body-anim {
      transform: scale(1.24);
      animation: frenzyRage 0.16s linear infinite;
      filter: drop-shadow(0 0 16px rgba(255, 42, 85, 0.9));
    }

    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes reactHop {
      0% { transform: translateY(0) scale(1, 1); }
      35% { transform: translateY(-18px) scale(0.92, 1.12); }
      75% { transform: translateY(2px) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    @keyframes reactScare {
      0% { transform: scale(1); }
      25% { transform: scale(1.2) translateX(-6px); }
      55% { transform: scale(0.88) translateX(6px); }
      100% { transform: scale(1) translateX(0); }
    }

    @keyframes reactSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Pirueta completa no ar */
    @keyframes reactFlip {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      45% { transform: translateY(-22px) rotate(180deg) scale(1.12); }
      100% { transform: translateY(0) rotate(360deg) scale(1); }
    }

    /* Bater água / nadar no ar */
    @keyframes reactSwim {
      0%, 100% { transform: rotate(-16deg) translateY(-4px); }
      50% { transform: rotate(16deg) translateY(5px); }
    }

    /* Virar de costas */
    @keyframes reactBack {
      0% { transform: scale(1); }
      40% { transform: scale(1.1, 0.94); }
      100% { transform: scale(1); }
    }

    @keyframes reactYawn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08, 0.94); }
    }

    @keyframes reactWink {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-10deg) scale(1.07); }
      80% { transform: rotate(7deg); }
    }

    @keyframes reactBurp {
      0% { transform: scale(1); }
      40% { transform: scale(1.18, 0.92); }
      100% { transform: scale(1); }
    }

    @keyframes reactFart {
      0% { transform: translateX(0); }
      30% { transform: translateX(-7px) rotate(-7deg); }
      65% { transform: translateX(7px) rotate(7deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes frenzyRage {
      0% { transform: scale(1.24) rotate(-8deg); }
      50% { transform: scale(1.28) rotate(8deg); }
      100% { transform: scale(1.24) rotate(-8deg); }
    }

    @keyframes stageShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -2px); }
    }

    @keyframes flapL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes flapR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }

    /* Sugestões rápidas e input */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 99px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip.surprise {
      background: linear-gradient(135deg, rgba(255, 42, 85, 0.25), rgba(255, 140, 26, 0.24));
      border-color: rgba(255, 140, 26, 0.55);
      color: #ffe3c2;
      font-weight: 600;
    }

    .input-bar {
      display: flex;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 6px;
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      padding: 8px 10px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-red), var(--accent-orange));
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal simples de histórico */
    .history-modal {
      position: absolute;
      inset: 0;
      background: rgba(12, 7, 17, 0.95);
      z-index: 30;
      display: none;
      flex-direction: column;
      padding: 20px;
    }
    .history-modal.open { display: flex; }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      max-width: 85%;
    }
    .msg-user {
      align-self: flex-end;
      background: rgba(255, 42, 85, 0.25);
    }
    .msg-demon {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand">
        <div class="avatar-badge">😈</div>
        <div class="brand-info">
          <h1>Capetinha AI <span class="status-pill">Online</span></h1>
          <p id="mood-text">Flutuando por aí...</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-history" title="Histórico">💬</button>
        <button class="icon-btn" id="btn-voice" title="Voz">🔊</button>
        <button class="icon-btn" id="btn-reset" title="Limpar memória">↺</button>
      </div>
    </header>

    <div class="speech-card">
      <div class="user-quote" id="user-quote">Toque em mim ou mande sua dúvida</div>
      <div class="demon-reply" id="demon-reply">"Fala logo, mortal. Qual decisão sensata vamos estragar hoje?"</div>
    </div>

    <main class="stage" id="stage">
      <div class="stage-hud">
        <span class="stage-tag" id="poke-tag">toques: 0</span>
      </div>

      <div class="demon-wrapper" id="demon">
        <div class="demon-body-anim" id="demon-anim">
          <svg viewBox="0 0 130 124" width="124" height="122">
            <defs>
              <radialGradient id="skinGrad" cx="45%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ff5e7e" />
                <stop offset="65%" stop-color="#d91642" />
                <stop offset="100%" stop-color="#870926" />
              </radialGradient>
            </defs>

            <!-- Asas (aparecem só quando voa) -->
            <g class="wings-group">
              <path class="wing-l" d="M40 58 C18 40, 10 60, 25 72 C31 66, 36 68, 40 66 Z" fill="#6b0f2b" />
              <path class="wing-r" d="M80 58 C102 40, 110 60, 95 72 C89 66, 84 68, 80 66 Z" fill="#6b0f2b" />
            </g>

            <!-- Tridente -->
            <line x1="106" y1="30" x2="106" y2="96" stroke="#ffbe0b" stroke-width="3.6" stroke-linecap="round" />
            <path d="M98 30 V43 C98 48 114 48 114 43 V30" fill="none" stroke="#ffbe0b" stroke-width="3.4" stroke-linecap="round" />
            <line x1="106" y1="24" x2="106" y2="47" stroke="#ffbe0b" stroke-width="3.4" stroke-linecap="round" />

            <!-- Rabinho com ponta -->
            <path d="M44 86 Q24 90 28 72" fill="none" stroke="#b81237" stroke-width="4" stroke-linecap="round" />
            <polygon points="28,68 23,76 33,76" fill="#ff2a55" />

            <!-- Perninhas (aparecem só quando caminha) -->
            <g class="legs-group">
              <g class="leg-l">
                <rect x="50" y="92" width="6" height="14" rx="3" fill="#b81237" />
                <ellipse cx="51" cy="107" rx="5.5" ry="3" fill="#ff2a55" />
              </g>
              <g class="leg-r">
                <rect x="64" y="92" width="6" height="14" rx="3" fill="#b81237" />
                <ellipse cx="67" cy="107" rx="5.5" ry="3" fill="#ff2a55" />
              </g>
            </g>

            <!-- Corpo -->
            <ellipse cx="60" cy="74" rx="20" ry="21" fill="url(#skinGrad)" />

            <!-- Frente -->
            <g class="front-view">
              <circle cx="60" cy="47" r="24" fill="url(#skinGrad)" />
              <path d="M42 29 L31 11 L49 23 Z" fill="#ff2a55" stroke="#3b0514" stroke-width="2" stroke-linejoin="round" />
              <path d="M78 29 L89 11 L71 23 Z" fill="#ff2a55" stroke="#3b0514" stroke-width="2" stroke-linejoin="round" />
              <circle cx="51" cy="46" r="6" fill="#fff" />
              <circle cx="69" cy="46" r="6" fill="#fff" />
              <circle cx="52" cy="47" r="2.7" fill="#14081a" />
              <circle cx="68" cy="47" r="2.7" fill="#14081a" />
              <line x1="44" y1="40" x2="56" y2="43" stroke="#3b0514" stroke-width="2.8" stroke-linecap="round" />
              <line x1="76" y1="40" x2="64" y2="43" stroke="#3b0514" stroke-width="2.8" stroke-linecap="round" />
              <path d="M48 55 Q60 65 72 55" fill="none" stroke="#3b0514" stroke-width="2.6" stroke-linecap="round" />
              <polygon points="52,57 54,61 56,58" fill="#fff" />
              <polygon points="64,58 66,61 68,57" fill="#fff" />
            </g>

            <!-- Costas (quando ele vira de costas) -->
            <g class="back-view">
              <circle cx="60" cy="47" r="24" fill="url(#skinGrad)" />
              <path d="M42 29 L31 11 L49 23 Z" fill="#a31032" stroke="#3b0514" stroke-width="2" stroke-linejoin="round" />
              <path d="M78 29 L89 11 L71 23 Z" fill="#a31032" stroke="#3b0514" stroke-width="2" stroke-linejoin="round" />
              <!-- Espinhas/detalhes das costas -->
              <polygon points="60,56 56,64 64,64" fill="#ffb833" />
              <polygon points="60,67 56,75 64,75" fill="#ffb833" />
              <polygon points="60,78 56,86 64,86" fill="#ffb833" />
            </g>
          </svg>
        </div>
      </div>

      <div class="stage-note" id="stage-note">Cutuca aí ou clica num foguinho 🔥 quando aparecer</div>
    </main>

    <div class="chips">
      <button class="chip surprise" id="btn-surprise">⚡ Surpreende</button>
      <button class="chip" data-q="Deveria sair hoje à noite?">🍻 Sair hoje?</button>
      <button class="chip" data-q="Compro algo caro por impulso?">💸 Comprar por impulso?</button>
      <button class="chip" data-q="Mando mensagem pra quem eu não deveria?">📱 Mandar mensagem?</button>
      <button class="chip" data-q="Tomo café agora mesmo sendo tarde?">☕ Café de madrugada?</button>
    </div>

    <form class="input-bar" id="chat-form">
      <input type="text" id="user-input" placeholder="Peça um mau conselho..." autocomplete="off" maxlength="250" />
      <button type="submit" class="send-btn" id="send-btn">Enviar</button>
    </form>

    <div class="history-modal" id="history-modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Memória da Sessão</strong>
        <button class="icon-btn" id="close-history">✕</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script>
    // Gera automaticamente o ícone PNG para a Tela de Início do iPhone (iOS)
    (function generateIOSIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#160d1f';
      ctx.fillRect(0, 0, 180, 180);
      ctx.font = '105px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('😈', 90, 96);
      document.getElementById('apple-icon').href = canvas.toDataURL('image/png');
    })();

    const stage = document.getElementById('stage');
    const demon = document.getElementById('demon');
    const demonAnim = document.getElementById('demon-anim');
    const moodText = document.getElementById('mood-text');
    const pokeTag = document.getElementById('poke-tag');
    const stageNote = document.getElementById('stage-note');
    const userQuote = document.getElementById('user-quote');
    const demonReply = document.getElementById('demon-reply');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let chatHistory = [];
    let voiceEnabled = true;
    let isBusy = false;
    let isFlying = true;
    let isFrenzy = false;

    let totalTaps = 0;
    let recentTapTimes = [];
    let lastPokeIdx = -1;

    let moveTimeout = null;
    let modeTimeout = null;
    let sparkTimeout = null;
    let idleTimeout = null;
    let reactTimeout = null;
    let backTimeout = null;
    let frenzyTimeout = null;

    // Cada toque sorteia uma reação diferente (sem repetir a anterior):
    // inclui bater água, pirueta, virar de costas e dar vácuo
    const pokePool = [
      {
        type: 'swim',
        cls: 'react-swim',
        duration: 850,
        note: "Batendo água no ar!",
        line: "Splash! Tô batendo água aqui no ar como se tivesse piscina de lava!"
      },
      {
        type: 'flip',
        cls: 'react-flip',
        duration: 750,
        note: "Virou pirueta!",
        line: "Olha a pirueta no ar! Nem o circo do submundo faz essa mortal!"
      },
      {
        type: 'back',
        cls: 'react-back',
        duration: 1600,
        turnBack: true,
        note: "Virou de costas pra você!",
        line: "Virei de costas. Não tô a fim de olhar na sua cara agora."
      },
      {
        type: 'ghost',
        cls: '',
        duration: 900,
        ghost: true,
        note: "Te deu um vácuo marrento!",
        line: "..."
      },
      {
        type: 'hop',
        cls: 'react-hop',
        duration: 550,
        note: "Pulinho cartunesco!",
        line: "Boing! Pulei com o tridente na mão!"
      },
      {
        type: 'scare',
        cls: 'react-scare',
        duration: 550,
        note: "Tomou um sustinho!",
        line: "UAAAH! Que susto, zé! Quase derrubei o tridente!"
      },
      {
        type: 'spin',
        cls: 'react-spin',
        duration: 600,
        note: "Girou no ar!",
        line: "Vuuupt! Girou o mundinho inteiro agora!"
      },
      {
        type: 'yawn',
        cls: 'react-yawn',
        duration: 750,
        note: "*Bocejou*",
        line: "Huuuaaah... *bocejo de brasa*... que preguiça."
      },
      {
        type: 'wink',
        cls: 'react-wink',
        duration: 550,
        note: "*Piscou malandro*",
        line: "Pisquei e já bolei três planos péssimos."
      },
      {
        type: 'burp',
        cls: 'react-burp',
        duration: 550,
        note: "*Arrotou fumaça*",
        line: "*BRUUUUP!* Foi mal, o enxofre pegou pesado hoje!"
      },
      {
        type: 'fart',
        cls: 'react-fart',
        duration: 600,
        note: "*Soltou um peido*",
        line: "*PFFFFT!* Alerta de névoa suspeita no palco!"
      }
    ];

    const idleComments = [
      "Dez segundos parado me encarando... vai pedir um caos ou vai só olhar?",
      "Silêncio estranho aí... aposto que tá pensando em fazer besteira.",
      "Olhei pra você, você olhou pra mim... nenhum dos dois tem juízo.",
      "Tô aqui de boa e você aí parado. Manda uma dúvida logo!"
    ];

    const surpriseQuestions = [
      "Me dá um mau conselho absurdo para hoje",
      "Qual a escolha mais impulsiva e divertida que eu posso fazer agora?",
      "Como transformar uma decisão simples num drama engraçado?",
      "Qual a pior desculpa criativa para não fazer o que eu devia?"
    ];

    const freeSparkQuestions = [
      "Me dá um conselho bônus de foguinho bem caótico e engraçado",
      "Solta um mau conselho rápido sobre grana ou diversão",
      "Qual a ideia mais duvidosa e divertida para hoje?"
    ];

    const frenzyInsults = [
      "SEU BOCÓ! CABEÇA DE BAGRE!",
      "ZÉ RUELA! SOLTA O MEU CHIFRE!",
      "TRASTE! ESQUENTADINHO DE MEIA TIGELA!",
      "BANANÃO! QUER VIRAR CHURRASCO DE ENXOFRE?!"
    ];

    function randBetween(minMs, maxMs) {
      return minMs + Math.random() * (maxMs - minMs);
    }

    function pickNextPokeAction() {
      let idx = Math.floor(Math.random() * pokePool.length);
      if (pokePool.length > 1 && idx === lastPokeIdx) {
        idx = (idx + 1) % pokePool.length;
      }
      lastPokeIdx = idx;
      return pokePool[idx];
    }

    function applyLocomotionVisual() {
      demon.classList.toggle('walking', !isFlying);
      if (!isFrenzy && !isBusy) {
        moodText.textContent = isFlying ? "Flutuando por aí..." : "Caminhando pelo mundinho...";
      }
    }

    function setDemonPosition(xRatio, yRatio, durationSec = 1.8) {
      const rect = stage.getBoundingClientRect();
      const maxX = Math.max(80, rect.width - 70);
      const minX = 70;
      const minY = 56;
      const maxY = Math.max(minY + 30, rect.height - 64);

      const px = minX + xRatio * (maxX - minX);
      const py = isFlying
        ? minY + yRatio * (maxY - minY)
        : maxY;

      demon.style.transition = `left ${durationSec}s ease-in-out, top ${durationSec}s ease-in-out`;
      demon.style.left = `${px}px`;
      demon.style.top = `${py}px`;
    }

    function scheduleLocomotionMove() {
      clearTimeout(moveTimeout);
      const waitMs = randBetween(3800, 8200);
      moveTimeout = setTimeout(() => {
        if (!isBusy && !isFrenzy) {
          setDemonPosition(Math.random(), Math.random(), randBetween(1.5, 2.4).toFixed(2));
        }
        scheduleLocomotionMove();
      }, waitMs);
    }

    function scheduleLocomotionChoice() {
      clearTimeout(modeTimeout);
      const waitMs = randBetween(7500, 15000);
      modeTimeout = setTimeout(() => {
        if (!isFrenzy) {
          isFlying = Math.random() < 0.55;
          applyLocomotionVisual();
          if (!isBusy) {
            setDemonPosition(Math.random(), Math.random(), 1.6);
          }
        }
        scheduleLocomotionChoice();
      }, waitMs);
    }

    function resetIdleTimer() {
      clearTimeout(idleTimeout);
      idleTimeout = setTimeout(() => {
        if (isBusy || isFrenzy) return;
        const line = idleComments[Math.floor(Math.random() * idleComments.length)];
        stageNote.textContent = "10s parado olhando...";
        moodText.textContent = "Reparou que você tá parado";
        userQuote.textContent = "*Você ficou 10s parado encarando*";
        demonReply.textContent = `"${line}"`;
        speak(line);
      }, 10000);
    }

    // Voz masculina suave
    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/["*]/g, '').trim();
      if (!clean || clean === '...') return;
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'pt-BR';
      utter.pitch = 0.78;
      utter.rate = 0.94;
      const voices = window.speechSynthesis.getVoices();
      const ptMale = voices.find(v => v.lang.includes('pt') && /daniel|felipe|ricardo|male|masculin/i.test(v.name))
                  || voices.find(v => v.lang.includes('pt'));
      if (ptMale) utter.voice = ptMale;
      window.speechSynthesis.speak(utter);
    }

    function triggerFrenzyMode() {
      isFrenzy = true;
      clearTimeout(frenzyTimeout);
      demonAnim.classList.remove('turned-back');
      stage.classList.add('frenzy');
      moodText.textContent = "DIABÃO FRENÉTICO!";
      stageNote.textContent = "10 cliques! Virou diabão frenético!";

      let idx = 0;
      demonReply.textContent = `"${frenzyInsults[0]}"`;
      speak(frenzyInsults[0]);

      const interval = setInterval(() => {
        idx += 1;
        if (idx < frenzyInsults.length) {
          demonReply.textContent = `"${frenzyInsults[idx]}"`;
        }
      }, 700);

      frenzyTimeout = setTimeout(() => {
        clearInterval(interval);
        isFrenzy = false;
        stage.classList.remove('frenzy');
        recentTapTimes = [];
        applyLocomotionVisual();
        stageNote.textContent = "Calmei... pode mandar dúvida!";
        demonReply.textContent = '"Pronto, já xinguei por 3 segundos. Agora fala o que você quer!"';
        resetIdleTimer();
      }, 3000);
    }

    // Reação única por toque + easter egg de 10 cliques rápidos
    demon.addEventListener('click', () => {
      resetIdleTimer();
      totalTaps += 1;
      pokeTag.textContent = `toques: ${totalTaps}`;

      const now = Date.now();
      recentTapTimes = recentTapTimes.filter(t => now - t <= 2500);
      recentTapTimes.push(now);

      if (recentTapTimes.length >= 10 && !isFrenzy) {
        triggerFrenzyMode();
        return;
      }

      if (isFrenzy) return;

      const act = pickNextPokeAction();

      demonAnim.classList.remove(
        'react-hop',
        'react-scare',
        'react-spin',
        'react-flip',
        'react-swim',
        'react-back',
        'react-yawn',
        'react-wink',
        'react-burp',
        'react-fart'
      );
      void demonAnim.offsetWidth;

      if (act.cls) {
        demonAnim.classList.add(act.cls);
      }

      clearTimeout(backTimeout);
      if (act.turnBack) {
        demonAnim.classList.add('turned-back');
        backTimeout = setTimeout(() => {
          demonAnim.classList.remove('turned-back');
        }, act.duration);
      } else {
        demonAnim.classList.remove('turned-back');
      }

      if (!act.ghost && Math.random() < 0.5) {
        setDemonPosition(Math.random(), Math.random(), 1.2);
      }

      moodText.textContent = act.note;
      stageNote.textContent = act.note;
      userQuote.textContent = "*Você cutucou o Capetinha*";

      if (act.ghost) {
        demonReply.textContent = "*Ele te deu um vácuo e fingiu que não ouviu*";
      } else {
        demonReply.textContent = `"${act.line}"`;
        speak(act.line);
      }

      clearTimeout(reactTimeout);
      reactTimeout = setTimeout(() => {
        if (act.cls) demonAnim.classList.remove(act.cls);
      }, act.duration);
    });

    // Foguinhos aparecendo entre 40s e 1m30s para dar conselho grátis
    function scheduleNextSpark() {
      clearTimeout(sparkTimeout);
      const waitMs = randBetween(40000, 90000);
      sparkTimeout = setTimeout(() => {
        if (!stage.querySelector('.fire-spark')) {
          spawnSpark();
        } else {
          scheduleNextSpark();
        }
      }, waitMs);
    }

    function spawnSpark() {
      if (stage.querySelector('.fire-spark')) {
        scheduleNextSpark();
        return;
      }

      const rect = stage.getBoundingClientRect();
      const spark = document.createElement('button');
      spark.type = 'button';
      spark.className = 'fire-spark';
      spark.textContent = '🔥';
      spark.title = 'Conselho grátis!';

      const minX = 24;
      const maxX = Math.max(minX + 20, rect.width - 64);
      const minY = 44;
      const maxY = Math.max(minY + 20, rect.height - 76);

      spark.style.left = `${minX + Math.random() * (maxX - minX)}px`;
      spark.style.top = `${minY + Math.random() * (maxY - minY)}px`;

      const lifeMs = randBetween(6500, 12500);
      const expireTimer = setTimeout(() => {
        spark.remove();
        scheduleNextSpark();
      }, lifeMs);

      spark.addEventListener('click', () => {
        clearTimeout(expireTimer);
        spark.remove();
        scheduleNextSpark();
        resetIdleTimer();
        if (!isBusy) {
          const bonusPrompt = freeSparkQuestions[Math.floor(Math.random() * freeSparkQuestions.length)];
          stageNote.textContent = "🔥 Foguinho pego! Conselho grátis!";
          askDemon(bonusPrompt, "Foguinho 🔥 (Conselho grátis)");
        }
      });

      stage.appendChild(spark);
    }

    async function askDemon(question, displayLabel) {
      const text = String(question || '').trim();
      if (!text || isBusy) return;

      resetIdleTimer();
      isBusy = true;
      sendBtn.disabled = true;
      demonAnim.classList.remove('turned-back');
      setDemonPosition(0.5, 0.46, 1.1);
      moodText.textContent = "Tramando uma ideia péssima...";
      stageNote.textContent = "Pensando no pior conselho...";
      userQuote.textContent = `Você: "${displayLabel || text}"`;
      demonReply.textContent = "Deixa eu pensar no pior caminho possível...";

      chatHistory.push({ role: 'user', parts: [{ text }] });

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 24000);

      try {
        const res = await fetch('/api/conselho', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: chatHistory }),
          signal: controller.signal
        });

        const data = await res.json().catch(() => null);

        if (!res.ok) {
          const serverErr = data && typeof data.error === 'string' && data.error.trim()
            ? data.error.trim()
            : `Erro ${res.status} ao falar com /api/conselho.`;
          demonReply.textContent = `"${serverErr}"`;
          moodText.textContent = `Erro HTTP ${res.status}`;
          stageNote.textContent = "Confira GEMINI_API_KEY e a rota /api/conselho";
          return;
        }

        const reply = data && typeof data.reply === 'string' && data.reply.trim()
          ? data.reply.trim()
          : "Vai na fé e depois lida com as consequências.";

        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        demonReply.textContent = `"${reply}"`;
        moodText.textContent = "Satisfeito com o caos";
        stageNote.textContent = "Conselho entregue!";
        speak(reply);
      } catch (e) {
        demonReply.textContent = '"Perdi o sinal com o submundo. Tenta de novo!"';
        moodText.textContent = "Sem sinal";
        stageNote.textContent = "Falhou na chamada — tenta de novo";
      } finally {
        clearTimeout(timeoutId);
        isBusy = false;
        sendBtn.disabled = false;
        resetIdleTimer();
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInput.value;
      userInput.value = '';
      askDemon(val);
    });

    document.querySelectorAll('.chip[data-q]').forEach(btn => {
      btn.addEventListener('click', () => askDemon(btn.dataset.q));
    });

    document.getElementById('btn-surprise').addEventListener('click', () => {
      const pick = surpriseQuestions[Math.floor(Math.random() * surpriseQuestions.length)];
      askDemon(pick, `Surpreende: ${pick}`);
    });

    document.getElementById('btn-voice').addEventListener('click', (e) => {
      voiceEnabled = !voiceEnabled;
      e.currentTarget.textContent = voiceEnabled ? '🔊' : '🔇';
      if (!voiceEnabled) window.speechSynthesis.cancel();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      resetIdleTimer();
      chatHistory = [];
      userQuote.textContent = "Memória apagada";
      demonReply.textContent = '"Pronto, fingi que nunca te vi. Qual a próxima besteira?"';
      moodText.textContent = "Pronto para recomeçar";
      stageNote.textContent = "Memória zerada!";
    });

    // Histórico modal
    const modal = document.getElementById('history-modal');
    const historyList = document.getElementById('history-list');
    document.getElementById('btn-history').addEventListener('click', () => {
      historyList.innerHTML = chatHistory.length
        ? chatHistory.map(m => `<div class="msg-bubble ${m.role === 'user' ? 'msg-user' : 'msg-demon'}">${m.parts[0].text}</div>`).join('')
        : '<p style="color:#a695b8; text-align:center;">Nenhuma conversa ainda.</p>';
      modal.classList.add('open');
    });
    document.getElementById('close-history').addEventListener('click', () => modal.classList.remove('open'));

    userInput.addEventListener('input', resetIdleTimer);
    document.addEventListener('pointerdown', resetIdleTimer, { passive: true });

    applyLocomotionVisual();
    setDemonPosition(0.5, 0.5, 0.4);
    scheduleLocomotionMove();
    scheduleLocomotionChoice();
    scheduleNextSpark();
    resetIdleTimer();
  </script>
</body>
</html>
