<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Capetinha AI</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Capetinha AI" />
  <meta name="theme-color" content="#0c0711" />
  <link id="apple-icon" rel="apple-touch-icon" href="" />

  <style>
    :root {
      --bg-dark: #0c0711;
      --bg-card: #160d1f;
      --accent-red: #ff2a55;
      --accent-orange: #ff8c1a;
      --accent-gold: #ffd166;
      --text-main: #f8f2fc;
      --text-muted: #a695b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 35%, #231133 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 12px) + 8px) 14px calc(env(safe-area-inset-bottom, 14px) + 4px);
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
      z-index: 10;
      gap: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #7a0c2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(255, 42, 85, 0.45);
    }

    .brand-info h1 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .status-pill {
      font-size: 10px;
      background: rgba(46, 213, 115, 0.15);
      color: #2ed573;
      padding: 2px 6px;
      border-radius: 99px;
      font-weight: 600;
    }

    .brand-info p {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 155px;
    }

    .top-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .speech-card {
      background: rgba(22, 13, 31, 0.85);
      border: 1px solid rgba(255, 42, 85, 0.28);
      border-radius: 18px;
      padding: 12px 15px;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 10;
      backdrop-filter: blur(8px);
      user-select: text;
      -webkit-user-select: text;
    }

    .user-quote {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 5px;
      text-align: center;
    }

    .demon-reply {
      font-size: 14.5px;
      line-height: 1.4;
      font-weight: 600;
      text-align: center;
      color: #fff;
    }

    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: 8px 0;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 42, 85, 0.15), transparent 64%),
        radial-gradient(circle at 80% 20%, rgba(255, 140, 26, 0.08), transparent 45%),
        linear-gradient(rgba(255, 42, 85, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 42, 85, 0.035) 1px, transparent 1px),
        rgba(9, 5, 15, 0.72);
      background-size: auto, auto, 28px 28px, 28px 28px, auto;
      border: 1px solid rgba(255, 42, 85, 0.3);
      box-shadow:
        inset 0 0 36px rgba(255, 42, 85, 0.12),
        0 10px 24px rgba(0, 0, 0, 0.4);
    }

    .stage-floor {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 22px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 140, 26, 0.45), rgba(255, 42, 85, 0.45), transparent);
      pointer-events: none;
      z-index: 1;
    }

    .ember {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 8px var(--accent-orange);
      opacity: 0.45;
      pointer-events: none;
      z-index: 1;
      animation: emberRise linear infinite;
    }

    @keyframes emberRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      25% { opacity: 0.55; }
      85% { opacity: 0.35; }
      100% { transform: translateY(-190px) scale(1.2); opacity: 0; }
    }

    .fire-spark {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 190, 50, 0.85);
      background: radial-gradient(circle, rgba(255, 180, 30, 0.35), rgba(255, 42, 85, 0.24));
      box-shadow: 0 0 16px rgba(255, 42, 85, 0.55);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 7;
      animation: sparkPulse 1.3s ease-in-out infinite;
      touch-action: manipulation;
    }

    @keyframes sparkPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .demon-wrapper {
      position: absolute;
      width: 146px;
      height: 138px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      z-index: 5;
    }

    .demon-body-anim {
      width: 100%;
      height: 100%;
      animation: floatBob 3.4s ease-in-out infinite;
      filter: drop-shadow(0 6px 14px rgba(255, 42, 85, 0.35));
    }

    .demon-wrapper.still .demon-body-anim {
      animation: gentleIdleBreath 2.6s ease-in-out infinite;
    }

    .demon-wrapper.walking .demon-body-anim {
      animation: walkBounce 0.68s ease-in-out infinite;
    }

    .demon-wrapper.sitting .demon-body-anim {
      animation: sitChill 2.8s ease-in-out infinite;
    }

    .wings-group {
      transform-origin: 60px 66px;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.25s ease, transform 0.28s ease;
    }

    .demon-wrapper.walking .wings-group,
    .demon-wrapper.sitting .wings-group {
      opacity: 0;
      transform: scale(0.1);
      pointer-events: none;
    }

    .wing-l {
      transform-origin: 41px 64px;
      animation: flapL 0.85s ease-in-out infinite;
    }
    .wing-r {
      transform-origin: 79px 64px;
      animation: flapR 0.85s ease-in-out infinite;
    }

    .legs-group {
      transform-origin: 60px 95px;
      opacity: 0;
      transform: scaleY(0.1);
      transition: opacity 0.25s ease, transform 0.28s ease;
    }

    .demon-wrapper.walking .legs-group,
    .demon-wrapper.sitting .legs-group {
      opacity: 1;
      transform: scaleY(1);
    }

    .demon-wrapper.walking .leg-l {
      transform-origin: 53px 96px;
      animation: stepL 0.68s ease-in-out infinite;
    }

    .demon-wrapper.walking .leg-r {
      transform-origin: 67px 96px;
      animation: stepR 0.68s ease-in-out infinite;
    }

    .demon-wrapper.sitting .leg-l {
      transform-origin: 53px 96px;
      transform: rotate(-42deg) translate(2px, -4px);
    }
    .demon-wrapper.sitting .leg-r {
      transform-origin: 67px 96px;
      transform: rotate(35deg) translate(-2px, -3px);
    }

    @keyframes gentleIdleBreath {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-2px) scale(1.015); }
    }

    @keyframes sitChill {
      0%, 100% { transform: translateY(4px) rotate(0deg); }
      50% { transform: translateY(5px) rotate(-1.5deg); }
    }

    .burp-waves { opacity: 0; pointer-events: none; }
    .demon-body-anim.react-burp .burp-waves {
      opacity: 1;
      animation: burpWaveAnim 0.65s ease-out forwards;
    }

    .yawn-smoke { opacity: 0; pointer-events: none; }
    .demon-body-anim.react-yawn .yawn-smoke {
      opacity: 1;
      animation: yawnSmokeAnim 0.95s ease-out forwards;
    }

    .fart-flame { opacity: 0; pointer-events: none; transform-origin: 26px 80px; }
    .demon-body-anim.react-fart .fart-flame {
      opacity: 1;
      animation: fartFlameAnim 0.7s ease-out forwards;
    }

    @keyframes burpWaveAnim {
      0% { transform: translateX(0) scale(0.7); opacity: 0.2; }
      45% { transform: translateX(6px) scale(1.08); opacity: 1; }
      100% { transform: translateX(12px) scale(1.18); opacity: 0; }
    }

    @keyframes yawnSmokeAnim {
      0% { transform: translateY(4px) scale(0.65); opacity: 0.25; }
      50% { transform: translateY(-8px) scale(1.05); opacity: 0.95; }
      100% { transform: translateY(-18px) scale(1.25); opacity: 0; }
    }

    @keyframes fartFlameAnim {
      0% { transform: translateX(4px) scale(0.5); opacity: 0.2; }
      40% { transform: translateX(-6px) scale(1.2); opacity: 1; }
      100% { transform: translateX(-14px) scale(1.35); opacity: 0; }
    }

    .back-view { display: none; }
    .demon-body-anim.turned-back .front-view { display: none; }
    .demon-body-anim.turned-back .back-view { display: block; }

    @keyframes walkBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }

    @keyframes stepL {
      0%, 100% { transform: rotate(-16deg) translateY(0); }
      50% { transform: rotate(16deg) translateY(-1.5px); }
    }

    @keyframes stepR {
      0%, 100% { transform: rotate(16deg) translateY(-1.5px); }
      50% { transform: rotate(-16deg) translateY(0); }
    }

    .demon-body-anim.react-hop { animation: reactHop 0.48s cubic-bezier(0.2, 1.3, 0.35, 1); }
    .demon-body-anim.react-scare { animation: reactScare 0.5s ease-out; }
    .demon-body-anim.react-spin { animation: reactSpin 0.55s ease-out; }
    .demon-body-anim.react-flip { animation: reactFlip 0.72s cubic-bezier(0.22, 1, 0.36, 1); }
    .demon-body-anim.react-swim { animation: reactSwim 0.75s ease-in-out infinite; }
    .demon-body-anim.react-back { animation: reactBack 0.45s ease-out; }
    .demon-body-anim.react-yawn { animation: reactYawn 0.85s ease-in-out; }
    .demon-body-anim.react-wink { animation: reactWink 0.45s ease-in-out; }
    .demon-body-anim.react-burp { animation: reactBurp 0.6s ease-out; }
    .demon-body-anim.react-fart { animation: reactFart 0.65s ease-out; }

    .stage.frenzy {
      border-color: var(--accent-red);
      box-shadow:
        inset 0 0 42px rgba(255, 42, 85, 0.38),
        0 0 24px rgba(255, 42, 85, 0.45);
      animation: stageShake 0.14s linear infinite;
    }

    .stage.frenzy .demon-body-anim {
      transform: scale(1.24);
      animation: frenzyRage 0.16s linear infinite;
      filter: drop-shadow(0 0 16px rgba(255, 42, 85, 0.9));
    }

    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }

    @keyframes reactHop {
      0% { transform: translateY(0) scale(1, 1); }
      35% { transform: translateY(-18px) scale(0.92, 1.12); }
      75% { transform: translateY(2px) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    @keyframes reactScare {
      0% { transform: scale(1); }
      25% { transform: scale(1.2) translateX(-6px); }
      55% { transform: scale(0.88) translateX(6px); }
      100% { transform: scale(1) translateX(0); }
    }

    @keyframes reactSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes reactFlip {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      45% { transform: translateY(-22px) rotate(180deg) scale(1.12); }
      100% { transform: translateY(0) rotate(360deg) scale(1); }
    }

    @keyframes reactSwim {
      0%, 100% { transform: rotate(-16deg) translateY(-4px); }
      50% { transform: rotate(16deg) translateY(5px); }
    }

    @keyframes reactBack {
      0% { transform: scale(1); }
      40% { transform: scale(1.1, 0.94); }
      100% { transform: scale(1); }
    }

    @keyframes reactYawn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08, 0.95); }
    }

    @keyframes reactWink {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-10deg) scale(1.07); }
      80% { transform: rotate(7deg); }
    }

    @keyframes reactBurp {
      0% { transform: scale(1); }
      35% { transform: scale(1.18, 0.92); }
      100% { transform: scale(1); }
    }

    @keyframes reactFart {
      0% { transform: translateX(0); }
      30% { transform: translateX(-7px) rotate(-7deg); }
      65% { transform: translateX(7px) rotate(7deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes frenzyRage {
      0% { transform: scale(1.24) rotate(-8deg); }
      50% { transform: scale(1.28) rotate(8deg); }
      100% { transform: scale(1.24) rotate(-8deg); }
    }

    @keyframes stageShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -2px); }
    }

    @keyframes flapL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes flapR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      padding: 8px 13px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .chip.surprise {
      background: linear-gradient(135deg, rgba(255, 42, 85, 0.3), rgba(255, 140, 26, 0.28));
      border-color: rgba(255, 190, 50, 0.55);
      color: #fff0d6;
      font-weight: 700;
    }

    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, rgba(28, 16, 40, 0.96), rgba(18, 10, 27, 0.98));
      border: 1px solid rgba(255, 42, 85, 0.28);
      border-radius: 18px;
      padding: 6px 6px 6px 14px;
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      padding: 8px 4px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-red), var(--accent-orange));
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 13px;
      font-size: 14px;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.5;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(12, 7, 17, 0.97);
      z-index: 30;
      display: none;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 14px) + 34px) 18px calc(env(safe-area-inset-bottom, 14px) + 18px);
      gap: 12px;
    }
    .modal-backdrop.open { display: flex; }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      max-width: 85%;
    }
    .msg-user { align-self: flex-end; background: rgba(255, 42, 85, 0.25); }
    .msg-demon { align-self: flex-start; background: rgba(255, 255, 255, 0.08); }

    .wardrobe-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .wardrobe-tabs::-webkit-scrollbar { display: none; }

    .w-tab {
      white-space: nowrap;
      padding: 7px 11px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .w-tab.active {
      background: linear-gradient(135deg, var(--accent-red), var(--accent-orange));
      color: #fff;
      border-color: transparent;
    }

    .wardrobe-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-bottom: 8px;
    }

    .w-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 9px 10px;
      color: #fff;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .w-item.equipped {
      border-color: var(--accent-gold);
      background: rgba(255, 209, 102, 0.14);
    }

    .w-item small {
      color: var(--text-muted);
      font-size: 10px;
    }

    .wardrobe-footer {
      display: flex;
      gap: 8px;
    }

    .w-clear-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand">
        <div class="avatar-badge">😈</div>
        <div class="brand-info">
          <h1>Capetinha AI <span class="status-pill">Online</span></h1>
          <p id="mood-text">De boa por aí...</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-wardrobe" title="Guarda-roupa">👗</button>
        <button class="icon-btn" id="btn-history" title="Histórico">💬</button>
        <button class="icon-btn" id="btn-voice" title="Voz">🔊</button>
        <button class="icon-btn" id="btn-reset" title="Limpar memória">↺</button>
      </div>
    </header>

    <div class="speech-card">
      <div class="user-quote" id="user-quote">Toque em mim ou mande sua dúvida</div>
      <div class="demon-reply" id="demon-reply">"Fala logo, mortal. Qual decisão sensata vamos estragar hoje?"</div>
    </div>

    <main class="stage" id="stage">
      <div class="stage-floor"></div>
      <span class="ember" style="left: 18%; bottom: 24px; animation-duration: 5.2s; animation-delay: 0s;"></span>
      <span class="ember" style="left: 42%; bottom: 24px; animation-duration: 6.4s; animation-delay: 1.5s;"></span>
      <span class="ember" style="left: 68%; bottom: 24px; animation-duration: 4.9s; animation-delay: 0.7s;"></span>
      <span class="ember" style="left: 84%; bottom: 24px; animation-duration: 6.0s; animation-delay: 2.3s;"></span>

      <div class="demon-wrapper" id="demon">
        <div class="demon-body-anim" id="demon-anim">
          <svg viewBox="0 0 136 128" width="144" height="136">
            <defs>
              <radialGradient id="skinGrad" cx="44%" cy="34%" r="68%">
                <stop offset="0%" stop-color="#ff4d6d" />
                <stop offset="62%" stop-color="#e11438" />
                <stop offset="100%" stop-color="#990722" />
              </radialGradient>
              <linearGradient id="goldHorn" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffe680" />
                <stop offset="55%" stop-color="#ffbe0b" />
                <stop offset="100%" stop-color="#d97706" />
              </linearGradient>

              <pattern id="texCurls" width="8" height="8" patternUnits="userSpaceOnUse">
                <circle cx="4" cy="4" r="3.2" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.2" />
              </pattern>
              <pattern id="texStripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,0.22)" stroke-width="2" />
              </pattern>
              <pattern id="texPlaid" width="8" height="8" patternUnits="userSpaceOnUse">

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('😈', 90, 96);
      document.getElementById('apple-icon').href = canvas.toDataURL('image/png');
    })();

    const stage = document.getElementById('stage');

    const equipped = {
      hair: null,
      shirt: null,
      shorts: null,
      pants: null,
      shoes: null,
      glasses: null,
      weapon: null
    };

    function saveOutfit() {
      try {
        const compact = {};
        Object.keys(equipped).forEach((cat) => {
          compact[cat] = equipped[cat] ? equipped[cat].id : null;
        });
        localStorage.setItem(OUTFIT_STORAGE_KEY, JSON.stringify(compact));
      } catch (_) {}
    }

    function loadSavedOutfit() {
      try {
        const raw = localStorage.getItem(OUTFIT_STORAGE_KEY);
        if (!raw) return;
        const savedIds = JSON.parse(raw);
        if (!savedIds || typeof savedIds !== "object") return;

        Object.keys(equipped).forEach((cat) => {
          const id = savedIds[cat];
          const list = wardrobeCatalog[cat] || [];
          equipped[cat] = id ? (list.find((item) => item.id === id) || null) : null;
        });
      } catch (_) {}
    }

    const stylesPool = [
      "Streetwear", "Gótico/Submundo", "BDSM Couro/Fivela",
      "Casual", "Retrô/Clássico", "Esportivo", "Fantasia"

    const palette = [
      "#18151d", "#ff2a55", "#ffd166", "#22d3ee", "#a855f7",

    function build50Items(category, prefixes, nouns, cutTypes) {
      const list = [];
      for (let i = 1; i <= 50; i++) {
        const p = prefixes[(i - 1) % prefixes.length];
        const n = nouns[(i - 1) % nouns.length];
        const st = stylesPool[(i - 1) % stylesPool.length];
        const color = palette[(i - 1) % palette.length];
        const accent = palette[(i + 2) % palette.length];
        const cut = cutTypes[(i - 1) % cutTypes.length];
        list.push({
          id: `${category}-${i}`,
          name: `${n} ${p} #${i}`,
          style: st,
          color,
          accent,
          cut
        });
      }
      return list;
    }

    function pickMalePortugueseVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;

      const ptVoices = voices.filter(v => String(v.lang || '').toLowerCase().startsWith('pt'));
      const pool = ptVoices.length ? ptVoices : voices;

      const maleHints = ['male', 'masculino', 'daniel', 'felipe', 'ricardo', 'bruno', 'lucas', 'thiago', 'jorge', 'paulo', 'carlos', 'diego', 'mateus', 'henrique'];
      const femaleHints = ['female', 'feminina', 'luciana', 'camila', 'vitoria', 'vitória', 'fernanda', 'mariana', 'helena', 'beatriz', 'francisca', 'raquel'];

      const explicitMale = pool.find(v => {
        const n = `${v.name || ''} ${v.voiceURI || ''}`.toLowerCase();
        return maleHints.some(h => n.includes(h));
      });
      if (explicitMale) return explicitMale;

      const nonFemale = pool.find(v => {
        const n = `${v.name || ''} ${v.voiceURI || ''}`.toLowerCase();
        return !femaleHints.some(h => n.includes(h));
      });
      return nonFemale || pool[0] || null;
    }

    function unlockSpeech() {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.getVoices();
        if (!speechUnlocked) {
          const probe = new SpeechSynthesisUtterance(' ');
          probe.lang = 'pt-BR';
          probe.volume = 0;
          window.speechSynthesis.speak(probe);
          speechUnlocked = true;
        }
      } catch (_) {}
    }

    function stopSpeech() {
      clearTimeout(speakTimer);
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (_) {}
      }
    }

    function speakText(text, moodStyle = "normal") {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      const clean = String(text || '').replace(/["*]/g, '').trim();
      if (!clean || clean === '...') return;

      clearTimeout(speakTimer);

      const dispatchUtterance = () => {
        try {
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = 'pt-BR';
          const chosen = pickMalePortugueseVoice();
          if (chosen) utter.voice = chosen;

          utter.pitch = moodStyle === "mad" ? 0.68 : 0.78;
          utter.rate = moodStyle === "mad" ? 0.96 : 0.90;
          utter.volume = 1.0;

          window.speechSynthesis.speak(utter);
        } catch (_) {}
      };

      try {
        const isActive = window.speechSynthesis.speaking || window.speechSynthesis.pending;
        if (isActive) {
          window.speechSynthesis.cancel();
          speakTimer = setTimeout(dispatchUtterance, 50);
        } else {
          dispatchUtterance();
        }
      } catch (_) {
        dispatchUtterance();
      }
    }

    function moveTo(xRatio, yRatio, durationSec = 2.6, forceFloor = false) {
      currentX = Math.max(0.08, Math.min(0.92, xRatio));
      currentY = Math.max(0.10, Math.min(0.85, yRatio));

      const rect = stage.getBoundingClientRect();
      const maxX = Math.max(80, rect.width - 74);
      const minX = 72;
      const minY = 58;
      const floorCenterY = Math.max(minY + 36, rect.height - 64);
      const maxFlyCenterY = Math.max(minY + 24, floorCenterY - 22);

      const px = minX + currentX * (maxX - minX);
      const py = forceFloor
        ? floorCenterY
        : minY + currentY * (maxFlyCenterY - minY);

      demon.style.transition = `left ${durationSec}s ease-in-out, top ${durationSec}s ease-in-out`;
      demon.style.left = `${px}px`;
      demon.style.top = `${py}px`;
    }

    function runNaturalCycle() {
      clearTimeout(cycleTimeout);

      if (roll < 0.34) {
        applyPoseClass('fly');
        moveTo(Math.random(), Math.random(), 2.9, false);
        cycleTimeout = setTimeout(runNaturalCycle, randBetween(4500, 7500));
      } else if (roll < 0.62) {
        applyPoseClass('walk');
        moveTo(Math.random(), 1, 3.4, true);
        cycleTimeout = setTimeout(runNaturalCycle, randBetween(4500, 7500));
      } else if (roll < 0.82) {
        applyPoseClass('sit');
        moveTo(currentX, 1, 1.5, true);
        cycleTimeout = setTimeout(runNaturalCycle, randBetween(4500, 7500));
      } else {
        applyPoseClass('still');

      recentTapTimes = recentTapTimes.filter(t => now - t <= 2500);
      recentTapTimes.push(now);

      if (recentTapTimes.length >= 10 && !isFrenzy) {
        triggerFrenzyMode();
        return;
      }

      if (isFrenzy) return;

      let idx = Math.floor(Math.random() * pokeActionsBase.length);
      if (pokeActionsBase.length > 1 && idx === lastPokeIdx) {
        idx = (idx + 1) % pokeActionsBase.length;
      }
      lastPokeIdx = idx;
      const chosenAct = pokeActionsBase[idx];

      demonAnim.classList.remove(
        'react-hop', 'react-scare', 'react-spin', 'react-flip',
        'react-swim', 'react-back', 'react-yawn', 'react-wink',
        'react-burp', 'react-fart'
      );
      void demonAnim.offsetWidth;

      if (chosenAct.cls) demonAnim.classList.add(chosenAct.cls);

      clearTimeout(backTimeout);
      if (chosenAct.turnBack) {
        demonAnim.classList.add('turned-back');
        backTimeout = setTimeout(() => {
          demonAnim.classList.remove('turned-back');
        }, chosenAct.duration);
      } else {
        demonAnim.classList.remove('turned-back');
      }

      const line = buildPokeLine(chosenAct);
      moodText.textContent = chosenAct.mood;
      userQuote.textContent = "*Você cutucou o Capetinha*";

      if (chosenAct.ghost) {
        demonReply.textContent = "*Ele te deu um vácuo e fingiu que não ouviu*";
      } else {
        demonReply.textContent = `"${line}"`;
        speakText(line, "normal");
      }

      clearTimeout(reactTimeout);
      reactTimeout = setTimeout(() => {
        if (chosenAct.cls) demonAnim.classList.remove(chosenAct.cls);
      }, chosenAct.duration);
    });

    function scheduleNextSpark() {
      clearTimeout(sparkTimeout);
      const waitMs = randBetween(40000, 90000);
      sparkTimeout = setTimeout(() => {
        if (!stage.querySelector('.fire-spark')) {
          spawnSpark();
        } else {
          scheduleNextSpark();
        }
      }, waitMs);
    }

    function spawnSpark() {
      if (stage.querySelector('.fire-spark')) {
        scheduleNextSpark();
        return;
      }

      const relic = darkRelics[Math.floor(Math.random() * darkRelics.length)];
      const rect = stage.getBoundingClientRect();
      const spark = document.createElement('button');
      spark.type = 'button';
      spark.className = 'fire-spark';
      spark.textContent = relic.icon;
      spark.title = 'Conselho grátis!';

      const minX = 24;
      const maxX = Math.max(minX + 20, rect.width - 66);
      const minY = 36;
      const maxY = Math.max(minY + 20, rect.height - 82);

      spark.style.left = `${minX + Math.random() * (maxX - minX)}px`;
      spark.style.top = `${minY + Math.random() * (maxY - minY)}px`;

      const lifeMs = randBetween(6500, 12500);
      const expireTimer = setTimeout(() => {
        spark.remove();
        scheduleNextSpark();
      }, lifeMs);

      spark.addEventListener('click', () => {
        clearTimeout(expireTimer);
        spark.remove();
        scheduleNextSpark();
        resetIdleTimer();
        unlockSpeech();
        if (!isBusy) {
          const bonusPrompt = freeSparkQuestions[Math.floor(Math.random() * freeSparkQuestions.length)];
          askDemon(bonusPrompt, `${relic.label} (Conselho grátis)`);
        }
      });

      stage.appendChild(spark);
    }

    async function askDemon(question, displayLabel) {
      const text = String(question || '').trim();
      if (!text || isBusy) return;

      resetIdleTimer();
      unlockSpeech();
      clearTimeout(cycleTimeout);
      isBusy = true;
      sendBtn.disabled = true;

      demonAnim.classList.remove('turned-back');
      applyPoseClass('still');
      moveTo(0.5, 1, 1.0, true);

      moodText.textContent = "Parado pensando na resposta...";
      userQuote.textContent = `Você: "${displayLabel || text}"`;
      demonReply.textContent = "Deixa eu pensar no pior caminho possível...";

      chatHistory.push({ role: 'user', parts: [{ text }] });

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 24000);

      try {
        const res = await fetch('/api/conselho', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: chatHistory }),
          signal: controller.signal
        });

        const data = await res.json().catch(() => null);

        if (!res.ok) {
          const serverErr = data && typeof data.error === 'string' && data.error.trim()
            ? data.error.trim()
            : `Erro ${res.status} ao falar com /api/conselho.`;
          demonReply.textContent = `"${serverErr}"`;
          moodText.textContent = `Falha (${res.status})`;
          speakText(serverErr, "normal");
          return;
        }

        const reply = data && typeof data.reply === 'string' && data.reply.trim()
          ? data.reply.trim()
          : "Vai na fé e depois lida com as consequências.";

        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        demonReply.textContent = `"${reply}"`;
        moodText.textContent = "Respondeu parado de boa";
        speakText(reply, "normal");
      } catch (e) {
        const fallbackErr = "Perdi o sinal com o submundo. Tenta de novo!";
        demonReply.textContent = `"${fallbackErr}"`;
        moodText.textContent = "Sem sinal";
        speakText(fallbackErr, "normal");
      } finally {
        clearTimeout(timeoutId);
        isBusy = false;
        sendBtn.disabled = false;
        cycleTimeout = setTimeout(runNaturalCycle, 3200);
        resetIdleTimer();
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      unlockSpeech();
      const val = userInput.value;
      userInput.value = '';
      askDemon(val);
    });

    document.getElementById('btn-surprise').addEventListener('click', () => {
      unlockSpeech();
      const pick = surpriseQuestions[Math.floor(Math.random() * surpriseQuestions.length)];
      askDemon(pick, `Surpreende: ${pick}`);
    });

    document.getElementById('btn-voice').addEventListener('click', (e) => {
      voiceEnabled = !voiceEnabled;
      e.currentTarget.textContent = voiceEnabled ? '🔊' : '🔇';
      if (!voiceEnabled) {
        stopSpeech();
      } else {
        unlockSpeech();
        speakText("Voz ativada.", "normal");
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      resetIdleTimer();
      stopSpeech();
      chatHistory = [];
      userQuote.textContent = "Memória apagada";
      demonReply.textContent = '"Pronto, fingi que nunca te vi. Qual a próxima besteira?"';
      moodText.textContent = "Pronto para recomeçar";
    });

    const modal = document.getElementById('history-modal');
    const historyList = document.getElementById('history-list');
    document.getElementById('btn-history').addEventListener('click', () => {
      historyList.innerHTML = chatHistory.length
        ? chatHistory.map(m => `<div class="msg-bubble ${m.role === 'user' ? 'msg-user' : 'msg-demon'}">${m.parts[0].text}</div>`).join('')
        : '<p style="color:#a695b8; text-align:center;">Nenhuma conversa ainda.</p>';
      modal.classList.add('open');
    });
    document.getElementById('close-history').addEventListener('click', () => modal.classList.remove('open'));

    userInput.addEventListener('input', resetIdleTimer);
    document.addEventListener('pointerdown', () => {
      resetIdleTimer();
      unlockSpeech();
    }, { passive: true });

    loadSavedOutfit();
    renderRandomChips();
    renderCharacterOutfit();
    applyPoseClass('fly');
    moveTo(0.5, 0.45, 0.4, false);
    cycleTimeout = setTimeout(runNaturalCycle, 3200);
    scheduleNextSpark();
    resetIdleTimer();
  </script>
</body>
</html>
